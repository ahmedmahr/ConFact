<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/master.css" />
    <!-- font awsesome library -->
    <link rel="stylesheet" href="css/all.min.css" />
    <title>ConFact</title>
  </head>
  <body>
    <!-- Start Header -->
      <div class="header">
        <svg
          width="30"
          height="30"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#f5b915"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polygon points="12 2 21 7 21 17 12 22 3 17 3 7 12 2"></polygon>
          <circle cx="12" cy="12" r="3"></circle>
          <line x1="14.5" y1="9.5" x2="18" y2="6"></line>
        </svg>

        <h3 class="h-header">
          <span class="co-header">HALAQA</span> <span>WASL</span>
        </h3>
        <p class="p-header">INDUSTRAIAL SUPPLY CHAIN NETWORK</p>
      </div>
      <!-- End Header -->
    </div>
   
    <form class="login-card" id="loginForm">
      <label class="section-label">SELECT ENTERPRISE ENTITY ROLE</label>

      <div class="role-toggle">
        <button type="button" class="role-btn active" data-role="manufacturer">
          Manufacturer / Buyer
        </button>
        <button type="button" class="role-btn" data-role="supplier">
          Raw Material Supplier
        </button>
      </div>

      <div class="info-box">
        <span class="dot"></span>
        <p id="roleDescription">
          Source verified local raw materials within 10 km &amp; cut freight costs.
        </p>
      </div>

      <div class="input-group">
        <label for="taxId">Corporate Email / Industrial Tax ID</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-building input-icon"></i>
          <input type="text" id="taxId" required>
        </div>
      </div>

      <div class="input-group">
        <label for="password">Security Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock input-icon"></i>
          <input type="password" id="password" required>
          <i class="fa-regular fa-eye toggle-password" id="togglePassword"></i>
        </div>
      </div>

      <div class="form-options">
        <label class="checkbox-container">
          <input type="checkbox" checked>
          <span class="checkmark"></span>
          Keep me signed in
        </label>
        <a href="#" class="forgot-link">Forgot Password?</a>
      </div>

     <!-- Start Button -->
      <button type="submit" class="submit-btn">
        Access Network <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>
     <!-- End Button -->
     
    <footer class="footer">
      <p>New industrial facility? <a href="#">Request Enterprise Verification</a></p>
      <div class="badge">
        <span class="dot"></span> ISO-27001 &amp; EGYPT IDA VERIFIED B2B
      </div>
    </footer>
  </div>
    <script src="confact.js"></script>
  </body>
</html>
